<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抽籤系統</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
}

.container {
    width: 100%;
    max-width: 1250px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-top: 0;
    color: #1565c0;
    font-size: 38px;
}

.description {
    text-align: center;
    color: #666;
    font-size: 17px;
    margin-bottom: 25px;
}


/* ===================================
   GitHub 名單選擇區
=================================== */

.list-source-box {
    background: #f5f7fa;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
}

.list-source-box h2 {
    margin-top: 0;
}

/* 名單下拉式選單 */
#listSelect {
    width: 100%;
    padding: 14px 16px;
    font-size: 20px;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    border-radius: 10px;
    border: 2px solid #1565c0;
    background: white;
    color: #333;
    cursor: pointer;
}

#listSelect:hover {
    border-color: #0d47a1;
}

#listSelect:focus {
    outline: none;
    border-color: #0d47a1;
    box-shadow: 0 0 0 3px rgba(21,101,192,0.15);
}

#listSelect:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#githubMessage {
    margin-top: 15px;
    padding: 10px;
    background: white;
    border-radius: 8px;
    font-size: 16px;
    min-height: 42px;
}


/* ===================================
   主畫面
=================================== */

.main {
    display: grid;
    grid-template-columns: 1fr 1.1fr 1fr;
    gap: 20px;
}

.panel {
    background: #f8fafc;
    border-radius: 15px;
    padding: 20px;
    border: 1px solid #e0e0e0;
}

.panel h2 {
    margin-top: 0;
}


/* ===================================
   名單
=================================== */

textarea {
    width: 100%;
    height: 420px;
    resize: vertical;
    border: 2px solid #d0d7de;
    border-radius: 10px;
    padding: 15px;
    font-size: 18px;
    line-height: 1.8;
    background: white;
}

textarea:focus {
    outline: none;
    border-color: #1976d2;
}

.count-box {
    margin-top: 12px;
    padding: 10px;
    background: #e3f2fd;
    border-radius: 8px;
    text-align: center;
    font-size: 17px;
}

.count-number {
    color: #d32f2f;
    font-size: 24px;
    font-weight: bold;
}


/* ===================================
   抽籤設定
=================================== */

.setting-box {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
}

.setting-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

#drawCount {
    width: 100%;
    padding: 12px;
    font-size: 20px;
    border-radius: 8px;
    border: 2px solid #1976d2;
    background: white;
}

.voice-option {
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.voice-option input {
    width: 20px;
    height: 20px;
}


/* ===================================
   結果區
=================================== */

.result-area {
    min-height: 240px;
    background: linear-gradient(135deg, #1565c0, #42a5f5);
    border-radius: 15px;
    color: white;
    padding: 20px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.result-title {
    font-size: 20px;
    margin-bottom: 20px;
}

#result {
    font-size: 50px;
    font-weight: bold;
    min-height: 65px;
    text-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

#drawProgress {
    margin-top: 18px;
    font-size: 18px;
}


/* ===================================
   按鈕
=================================== */

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

#drawBtn {
    flex: 1;
    background: #e53935;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

#clearBtn {
    background: #757575;
    color: white;
}

#clearWinnerBtn {
    background: #00897b;
    color: white;
}

#testVoiceBtn {
    width: 100%;
    margin-top: 10px;
    background: #7b1fa2;
    color: white;
}


/* ===================================
   已抽中名單
=================================== */

.winner-box {
    background: white;
    border-radius: 12px;
    border: 1px solid #ddd;
    height: 420px;
    overflow-y: auto;
    padding: 15px;
}

#winnerList {
    list-style: none;
    margin: 0;
    padding: 0;
}

#winnerList li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 8px;

    background: #fff8e1;

    border-left: 5px solid #ff9800;
    border-radius: 8px;

    font-size: 19px;
}

.winner-number {
    min-width: 34px;
    height: 34px;

    border-radius: 50%;

    background: #ff9800;
    color: white;

    display: inline-flex;
    justify-content: center;
    align-items: center;

    font-weight: bold;
}

.winner-name {
    font-weight: bold;
}


/* ===================================
   動畫
=================================== */

.drawing {
    animation: pulse 0.12s infinite alternate;
}

@keyframes pulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.1);
    }

}


/* ===================================
   手機
=================================== */

@media(max-width: 900px) {

    .main {
        grid-template-columns: 1fr;
    }

    textarea,
    .winner-box {
        height: 300px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- =====================================
     名單來源
===================================== -->

<div class="list-source-box">

    <h2>📂 選擇抽籤名單</h2>

    <select id="listSelect">
        <option value="">-- 請選擇名單 --</option>
    </select>

    <div id="githubMessage">
        尚未讀取任何名單
    </div>

</div>


<div class="main">


<!-- =====================================
     左側
===================================== -->

<div class="panel">

    <h2>📋 待抽名單</h2>

    <textarea
        id="nameList"
        placeholder="請先從上方下拉式選單選擇名單。"></textarea>

    <div class="count-box">

        剩餘可抽：

        <span
            id="remainCount"
            class="count-number">
            0
        </span>

        人

    </div>

</div>



<!-- =====================================
     中間
===================================== -->

<div class="panel">

    <h2>🎲 抽籤設定</h2>

    <div class="setting-box">

        <div class="setting-title">
            一次抽出人數
        </div>

        <select id="drawCount">

            <option value="1">1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
            <option value="5">5 人</option>
            <option value="6">6 人</option>
            <option value="7">7 人</option>
            <option value="8">8 人</option>
            <option value="9">9 人</option>
            <option value="10">10 人</option>

        </select>


        <div class="voice-option">

            <input
                id="enableVoice"
                type="checkbox"
                checked>

            <label for="enableVoice">
                🔊 自動讀出抽中姓名
            </label>

        </div>


        <button
            id="testVoiceBtn"
            type="button">

            🔊 測試語音

        </button>

    </div>


    <div class="result-area">

        <div class="result-title">
            本次抽籤結果
        </div>

        <div id="result">
            等待抽籤
        </div>

        <div id="drawProgress">
            請先選擇名單
        </div>

    </div>


    <div class="buttons">

        <button
            id="drawBtn"
            type="button">

            🎲 開始抽籤

        </button>

        <button
            id="clearBtn"
            type="button">

            全部重設

        </button>

    </div>

</div>



<!-- =====================================
     右側
===================================== -->

<div class="panel">

    <h2>🏆 已抽中清單</h2>

    <div class="winner-box">

        <ul id="winnerList"></ul>

    </div>


    <div class="count-box">

        累計已抽：

        <span
            id="winnerCount"
            class="count-number">
            0
        </span>

        人

    </div>


    <div class="buttons">

        <button
            id="clearWinnerBtn"
            type="button">

            清除抽中紀錄

        </button>

    </div>

</div>


</div>
</div>


<script>

// ======================================================
// JSON 名單設定
//
// 新增班級時，只要增加一筆資料即可。
// 下拉式選單會自動產生。
// ======================================================

const githubLists = [

    {
        "id": "classA",
        "name": "四子一B",
        "url": "https://github.com/derricktsai0904/JavaScript/blob/master/115-01/%E5%9B%9B%E5%AD%90%E4%B8%80B%E5%90%8D%E5%96%AE.txt"
    },

    {
        "id": "classB",
        "name": "程式設計實習_五專一A",
        "url": "https://github.com/derricktsai0904/JavaScript/blob/master/115-01/%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88%E5%AF%A6%E7%BF%92_%E4%BA%94%E5%B0%88%E4%B8%80A.txt"
    },

    {
        "id": "classC",
        "name": "程式設計概論_四子一B",
        "url": "https://github.com/derricktsai0904/JavaScript/blob/master/115-01/%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88%E6%A6%82%E8%AB%96_%E5%9B%9B%E5%AD%90%E4%B8%80B.txt"
    },

    {
        "id": "classD",
        "name": "計算機概論_五專四A",
        "url": "https://github.com/derricktsai0904/JavaScript/blob/master/115-01/%E8%A8%88%E7%AE%97%E6%A9%9F%E6%A6%82%E8%AB%96_%E4%BA%94%E5%B0%88%E5%9B%9BA.txt"
    },

    {
        "id": "classE",
        "name": "計算機組織與結構_四技3AC",
        "url": "https://github.com/derricktsai0904/JavaScript/blob/master/115-01/%E8%A8%88%E7%AE%97%E6%A9%9F%E7%B5%84%E7%B9%94%E8%88%87%E7%B5%90%E6%A7%8B_%E5%9B%9B%E6%8A%803AC.txt"
    },

    {
        "id": "classC",
        "name": "計算機組織與結構_四技3B",
        "url": "https://github.com/derricktsai0904/JavaScript/blob/master/115-01/%E8%A8%88%E7%AE%97%E6%A9%9F%E7%B5%84%E7%B9%94%E8%88%87%E7%B5%90%E6%A7%8B_%E5%9B%9B%E6%8A%803B.txt"
    }

];


// ======================================================
// 全域變數
// ======================================================

let drawing = false;

let winners = [];

let chineseVoice = null;

let currentListId = null;


// ======================================================
// DOM
// ======================================================

const listSelect =
    document.getElementById("listSelect");

const githubMessage =
    document.getElementById("githubMessage");

const nameList =
    document.getElementById("nameList");

const remainCount =
    document.getElementById("remainCount");

const winnerCount =
    document.getElementById("winnerCount");

const result =
    document.getElementById("result");

const drawProgress =
    document.getElementById("drawProgress");

const drawBtn =
    document.getElementById("drawBtn");

const drawCount =
    document.getElementById("drawCount");

const enableVoice =
    document.getElementById("enableVoice");

const winnerList =
    document.getElementById("winnerList");


// ======================================================
// 建立名單下拉式選單
// ======================================================

function createListSelect() {

    listSelect.innerHTML =
        '<option value="">-- 請選擇名單 --</option>';

    githubLists.forEach(item => {

        const option =
            document.createElement("option");

        option.value =
            item.id;

        option.textContent =
            item.name;

        listSelect.appendChild(
            option
        );

    });

}


// ======================================================
// 下拉式選單事件
// ======================================================

listSelect.addEventListener(
    "change",
    function() {

        const selectedId =
            this.value;

        if (!selectedId) {

            currentListId = null;

            nameList.value = "";

            winners = [];

            winnerList.innerHTML = "";

            result.textContent =
                "等待抽籤";

            drawProgress.textContent =
                "請先選擇名單";

            githubMessage.textContent =
                "尚未讀取任何名單";

            updateCount();

            return;

        }

        const selectedItem =
            githubLists.find(
                item =>
                    item.id === selectedId
            );

        if (selectedItem) {

            loadGithubList(
                selectedItem
            );

        }

    }
);


// ======================================================
// GitHub 一般網址轉 RAW
// ======================================================

function convertGithubUrl(url) {

    url =
        url.trim();

    // 已經是 RAW
    if (
        url.startsWith(
            "https://raw.githubusercontent.com/"
        )
    ) {

        return url;

    }


    // 一般 GitHub URL
    if (
        url.startsWith(
            "https://github.com/"
        )
    ) {

        url =
            url.replace(
                "https://github.com/",
                "https://raw.githubusercontent.com/"
            );

        url =
            url.replace(
                "/blob/",
                "/"
            );

    }

    return url;

}


// ======================================================
// 下拉選單選擇後讀取 TXT
// ======================================================

async function loadGithubList(item) {

    if (drawing) {
        return;
    }

    const url =
        convertGithubUrl(
            item.url
        );


    githubMessage.textContent =
        "⏳ 正在讀取「" +
        item.name +
        "」...";


    listSelect.disabled =
        true;


    try {

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        // TXT 每行一個名字
        const names =
            text
                .split(/\r?\n/)
                .map(
                    name =>
                        name.trim()
                )
                .filter(
                    name =>
                        name !== ""
                );


        if (
            names.length === 0
        ) {

            throw new Error(
                "TXT 檔案沒有有效名單"
            );

        }


        // 放入抽籤名單
        nameList.value =
            names.join("\n");


        // 切換不同名單時
        // 清除之前的抽籤紀錄

        winners = [];

        winnerList.innerHTML =
            "";


        result.textContent =
            "等待抽籤";


        drawProgress.textContent =
            "✅ " +
            item.name +
            " 已載入，可以開始抽籤";


        currentListId =
            item.id;


        listSelect.value =
            item.id;


        updateCount();


        githubMessage.textContent =
            "✅ 已載入：" +
            item.name +
            "，共 " +
            names.length +
            " 人";


    }
    catch(error) {

        console.error(
            error
        );


        githubMessage.textContent =
            "❌ 「" +
            item.name +
            "」讀取失敗：" +
            error.message;


        alert(
            item.name +
            " 讀取失敗！\n\n" +
            "請確認：\n" +
            "1. GitHub Repository 為 Public\n" +
            "2. TXT 檔案存在\n" +
            "3. GitHub 路徑正確"
        );


        listSelect.value =
            currentListId || "";

    }
    finally {

        listSelect.disabled =
            false;

    }

}


// ======================================================
// 中文語音
// ======================================================

function loadVoices() {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;

    }


    const voices =
        window.speechSynthesis
            .getVoices();


    // 優先台灣中文
    chineseVoice =
        voices.find(
            voice =>
                voice.lang === "zh-TW"
        );


    // 再找其他中文
    if (
        !chineseVoice
    ) {

        chineseVoice =
            voices.find(
                voice =>
                    voice.lang
                        .startsWith("zh")
            );

    }

}


if (
    "speechSynthesis"
    in window
) {

    loadVoices();

    window.speechSynthesis
        .onvoiceschanged =
        loadVoices;

}


// ======================================================
// 語音播放
// ======================================================

function speak(text) {

    return new Promise(

        resolve => {

            if (
                !enableVoice.checked
            ) {

                resolve();

                return;

            }


            if (
                !(
                    "speechSynthesis"
                    in window
                )
            ) {

                resolve();

                return;

            }


            window.speechSynthesis
                .cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                "zh-TW";

            utterance.rate =
                0.85;

            utterance.pitch =
                1;

            utterance.volume =
                1;


            if (
                chineseVoice
            ) {

                utterance.voice =
                    chineseVoice;

            }


            utterance.onend =
                resolve;

            utterance.onerror =
                resolve;


            window.speechSynthesis
                .speak(
                    utterance
                );

        }

    );

}


// ======================================================
// 取得目前待抽名單
// ======================================================

function getNames() {

    return nameList.value

        .split(/\r?\n/)

        .map(
            name =>
                name.trim()
        )

        .filter(
            name =>
                name !== ""
        );

}


// ======================================================
// 更新人數
// ======================================================

function updateCount() {

    remainCount.textContent =
        getNames().length;

    winnerCount.textContent =
        winners.length;

}


nameList.addEventListener(
    "input",
    updateCount
);


// ======================================================
// 延遲函式
// ======================================================

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


// ======================================================
// 抽出一人
// ======================================================

async function drawOne(names) {

    result.classList.add(
        "drawing"
    );


    // 跑馬燈動畫
    for (
        let i = 0;
        i < 22;
        i++
    ) {

        const randomName =
            names[
                Math.floor(
                    Math.random() *
                    names.length
                )
            ];


        result.textContent =
            randomName;


        await sleep(
            70 + i * 4
        );

    }


    result.classList.remove(
        "drawing"
    );


    // 正式抽出
    const index =
        Math.floor(
            Math.random() *
            names.length
        );


    const winner =
        names[index];


    result.textContent =
        winner;


    return winner;

}


// ======================================================
// 加入已抽中名單
// ======================================================

function addWinner(name) {

    const li =
        document.createElement("li");


    const number =
        document.createElement("span");

    number.className =
        "winner-number";

    number.textContent =
        winners.length;


    const nameSpan =
        document.createElement("span");

    nameSpan.className =
        "winner-name";

    nameSpan.textContent =
        name;


    li.appendChild(
        number
    );

    li.appendChild(
        nameSpan
    );


    winnerList.appendChild(
        li
    );


    // 自動捲到最下面
    const box =
        document.querySelector(
            ".winner-box"
        );

    box.scrollTop =
        box.scrollHeight;

}


// ======================================================
// 開始抽籤
// ======================================================

async function startDraw() {

    if (
        drawing
    ) {

        return;

    }


    let names =
        getNames();


    if (
        names.length === 0
    ) {

        alert(
            "請先選擇並讀取一份名單！"
        );

        return;

    }


    let wantCount =
        parseInt(
            drawCount.value,
            10
        );


    if (
        wantCount >
        names.length
    ) {

        alert(
            "目前剩餘只有 " +
            names.length +
            " 人，將全部抽出。"
        );


        wantCount =
            names.length;

    }


    drawing =
        true;


    drawBtn.disabled =
        true;

    drawCount.disabled =
        true;

    listSelect.disabled =
        true;


    drawBtn.textContent =
        "🎲 抽籤中...";


    // ==================================================
    // 連續抽出
    // ==================================================

    for (
        let i = 0;
        i < wantCount;
        i++
    ) {


        drawProgress.textContent =
            "正在抽第 " +
            (i + 1) +
            " / " +
            wantCount +
            " 人";


        const winner =
            await drawOne(
                names
            );


        // 加入已抽中
        winners.push(
            winner
        );


        addWinner(
            winner
        );


        // 從待抽名單移除
        const winnerIndex =
            names.indexOf(
                winner
            );


        if (
            winnerIndex !== -1
        ) {

            names.splice(
                winnerIndex,
                1
            );

        }


        nameList.value =
            names.join("\n");


        updateCount();


        // 語音讀出
        await speak(
            winner
        );


        // 多人連續抽籤時稍微停頓
        if (
            i <
            wantCount - 1
        ) {

            await sleep(
                400
            );

        }

    }


    drawProgress.textContent =
        "🎉 本次抽籤完成";


    drawing =
        false;


    drawBtn.disabled =
        false;

    drawCount.disabled =
        false;

    listSelect.disabled =
        false;


    drawBtn.textContent =
        "🎲 開始抽籤";

}
