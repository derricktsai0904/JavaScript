<!DOCTYPE html>

<html lang="zh-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>機器學習_抽籤系統</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#eef2f7;
}

h1{
    margin-top:40px;
}

#nameBox{
    margin:50px auto;
    width:420px;
    height:130px;
    line-height:130px;
    font-size:48px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{
    padding:15px 40px;
    font-size:20px;
    border:none;
    border-radius:8px;
    background:#007BFF;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<h1>🎲 機器學習_抽籤系統</h1>

<div id="nameBox">準備抽籤</div>

<button onclick="startCountdown()">開始抽籤</button>

<script>

let names = [
"劉炯炫",
"何慶福",
"莊楀",
"李俊緯",
"吳彥忠",
"曾士豪",
"王廷瑋",
"陳則閔",
"高聖傑",
"蔣宥辰",
"潘英俊",
"呂旻諺",
"李昌諺",
"李則昊",
"張廷杰",
"詹凱程",
"黃梓杰",
"張勇翔",
"何俊陞",
"胡立安",
"沈俊言",
"吳宗祐",
"陳彗萱",
"王振仰",
"鄭芷昀",
"王奕閎",
"曹瀚文",
"阮春程",
"毛霆漢",
"柯怡安",
"郭芳欣",
"陳肇延",
"張雅喬",
"蔡亞倫",
"楊博涵",
"官威宏"
];


// 語音播放並在結束後執行 callback
function speak(text, callback){

    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "zh-TW";
    speech.rate = 1;
    speech.pitch = 1;

    speech.onend = function(){
        if(callback) callback();
    }

    window.speechSynthesis.speak(speech);
}


// 倒數同步播放
function startCountdown(){

    let box = document.getElementById("nameBox");

    let numbers = ["3","2","1"];

    function next(i){

        if(i < numbers.length){

            box.innerHTML = numbers[i];

            speak(numbers[i], function(){
                next(i+1);
            });

        }else{

            box.innerHTML = "開始抽";
            speak("開始抽", function(){
                startPick();
            });

        }
    }

    next(0);
}


// 抽人動畫
function startPick(){

    let box = document.getElementById("nameBox");

    let count = 0;

    let timer = setInterval(function(){

        let index = Math.floor(Math.random()*names.length);

        box.innerHTML = names[index];

        count++;

        if(count > 60){

            clearInterval(timer);

            let finalIndex = Math.floor(Math.random()*names.length);
            let winner = names[finalIndex];

            box.innerHTML = "🎉 " + winner;

            speak("恭喜 " + winner);
        }

    },50);

}

</script>


</body></html>
